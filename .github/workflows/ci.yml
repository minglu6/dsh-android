name: ci
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Release APK size gate (bytes). Keep aligned with a lean WS-only build (no iroh .so).
  DSH_ANDROID_APK_MAX_BYTES: 41943040

jobs:
  # Optional legacy pocket-host (desktop iroh behind config.iroh=true; not on phone path).
  host-binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: pocket-host-linux-x64
          - os: macos-14
            artifact: pocket-host-darwin-arm64
    runs-on: ${{ matrix.os }}
    defaults: { run: { working-directory: plugin } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: plugin/iroh -> target
          key: host-${{ matrix.artifact }}
      - run: npm run build:iroh
      - name: stage binary
        run: |
          src=iroh/target/release/pocket-host
          test -x "$src"
          cp "$src" "${{ matrix.artifact }}"
          chmod 755 "${{ matrix.artifact }}"
          ls -lh "${{ matrix.artifact }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: plugin/${{ matrix.artifact }}

  plugin:
    needs: [host-binaries]
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: plugin } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        with:
          name: pocket-host-linux-x64
          path: /tmp/host
      - name: install pocket-host for tests
        run: |
          mkdir -p iroh/target/release
          cp /tmp/host/pocket-host-linux-x64 iroh/target/release/pocket-host
          chmod 755 iroh/target/release/pocket-host
          iroh/target/release/pocket-host --help >/dev/null
      - run: npm install
      - run: npm run lint
      - run: npm test

  integration:
    needs: [host-binaries]
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: plugin } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        with:
          name: pocket-host-linux-x64
          path: /tmp/host
      - name: install pocket-host for tests
        run: |
          mkdir -p iroh/target/release
          cp /tmp/host/pocket-host-linux-x64 iroh/target/release/pocket-host
          chmod 755 iroh/target/release/pocket-host
      - run: npm install
      - run: npm install -g pnpm@10 @deepseek-ai/dsh@0.2.1-alpha.2
      - run: dsh --version
      - run: npm run test:integration

  android:
    needs: [host-binaries]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: confirm no iroh jniLibs in tree
        run: |
          if [ -d app/app/src/main/jniLibs ]; then
            ! find app/app/src/main/jniLibs -name 'libpocket_iroh.so' | grep .
          fi
      - uses: actions/download-artifact@v4
        with:
          name: pocket-host-linux-x64
          path: /tmp/host
      - name: install pocket-host for kotlin-live
        run: |
          mkdir -p plugin/iroh/target/release
          cp /tmp/host/pocket-host-linux-x64 plugin/iroh/target/release/pocket-host
          chmod 755 plugin/iroh/target/release/pocket-host
      - run: npm install
        working-directory: plugin
      - run: npm install -g pnpm@10 @deepseek-ai/dsh@0.2.1-alpha.2
      - name: protocol client tests against real dsh + plugin
        working-directory: plugin
        run: node test/integration/kotlin-live.mjs
      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_B64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && \
             [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            umask 077
            printf '%s' "$ANDROID_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/dsh-android-release.jks"
            echo "DSH_ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/dsh-android-release.jks" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "DSH_RELEASE_SIGNING=secrets" >> "$GITHUB_ENV"
            echo "Using GitHub Secrets for release signing."
          else
            echo "DSH_RELEASE_SIGNING=debug-fallback" >> "$GITHUB_ENV"
            echo "Android signing secrets absent; release APK will use the debug keystore so CI stays green."
            echo "To publish a production-signed APK, add repository secrets:"
            echo "  ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD"
            echo "Never commit keystore files or passwords."
          fi
      - name: unit tests + debug + R8 release APK
        working-directory: app
        run: |
          ./gradlew --no-daemon \
            :core:protocol:test \
            :app:testDebugUnitTest \
            -Proborazzi.test.record=true \
            :app:assembleDebug \
            :app:assembleDebugAndroidTest \
            :app:assembleRelease
      - name: Remove signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/dsh-android-release.jks"
      - name: confirm APKs have no iroh native libs; report sizes
        run: |
          debug_apk=app/app/build/outputs/apk/debug/app-debug.apk
          release_apk=app/app/build/outputs/apk/release/app-release.apk
          for apk in "$debug_apk" "$release_apk"; do
            ls -lh "$apk"
            if unzip -l "$apk" | grep -E 'lib/.*/libpocket_iroh\.so'; then
              echo "APK still contains libpocket_iroh.so: $apk" >&2
              exit 1
            fi
            echo "APK_SIZE_BYTES=$(stat -c%s "$apk") path=$apk"
          done
      - name: Verify release signature
        run: |
          apksigner="$(find "${ANDROID_HOME:-$HOME/Android/Sdk}/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$apksigner" ] || [ ! -x "$apksigner" ]; then
            # setup-android may not install build-tools; pull a recent package
            yes | sdkmanager "build-tools;35.0.0" >/dev/null
            apksigner="$(find "${ANDROID_HOME:-$HOME/Android/Sdk}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          fi
          test -x "$apksigner"
          apk=app/app/build/outputs/apk/release/app-release.apk
          "$apksigner" verify --verbose --print-certs "$apk" | tee "$RUNNER_TEMP/dsh-android-apksigner.txt"
          grep -q 'Verified using v2 scheme' "$RUNNER_TEMP/dsh-android-apksigner.txt" \
            || grep -q 'Verified using v3 scheme' "$RUNNER_TEMP/dsh-android-apksigner.txt" \
            || grep -q 'Verified using v1 scheme' "$RUNNER_TEMP/dsh-android-apksigner.txt"
      - name: Enforce release APK size gate
        run: |
          apk=app/app/build/outputs/apk/release/app-release.apk
          maximum="${DSH_ANDROID_APK_MAX_BYTES}"
          actual="$(stat -c %s "$apk")"
          echo "release APK $actual bytes (limit $maximum); signing=$DSH_RELEASE_SIGNING"
          if [ "$actual" -gt "$maximum" ]; then
            echo "Android release APK is $actual bytes; limit is $maximum bytes." >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-android-debug
          path: |
            app/app/build/outputs/apk/debug/app-debug.apk
            app/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            app/app/build/screenshots/*.png
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-android-release
          path: app/app/build/outputs/apk/release/app-release.apk
      - uses: actions/download-artifact@v4
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        with:
          name: pocket-host-darwin-arm64
          path: /tmp/host-prebuilts
      - name: publish rolling release (release + debug APK + host prebuilts)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cp app/app/build/outputs/apk/release/app-release.apk dsh-android.apk
          cp app/app/build/outputs/apk/debug/app-debug.apk dsh-android-debug.apk
          cp /tmp/host/pocket-host-linux-x64 /tmp/host-prebuilts/pocket-host-linux-x64
          chmod 755 /tmp/host-prebuilts/*
          git tag -f dsh-android-latest && git push -f origin dsh-android-latest
          gh release view dsh-android-latest >/dev/null 2>&1 || gh release create dsh-android-latest --prerelease --title "dsh-android (latest)" --notes "Rolling build."
          notes="Rolling build @ ${GITHUB_SHA::7}. Signed release APK (R8/minify) + debug APK. WS-only (Tailscale/LAN); no libpocket_iroh.so. Signing=${DSH_RELEASE_SIGNING}. Optional desktop sidecars: pocket-host-linux-x64, pocket-host-darwin-arm64 (config.iroh=true)."
          gh release edit dsh-android-latest --notes "$notes"
          gh release upload dsh-android-latest \
            dsh-android.apk \
            dsh-android-debug.apk \
            /tmp/host-prebuilts/pocket-host-linux-x64 \
            /tmp/host-prebuilts/pocket-host-darwin-arm64 \
            --clobber
      - name: publish versioned GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          tag="${GITHUB_REF_NAME}"
          case "$tag" in
            v*) ;;
            *) echo "Unexpected ref for versioned release: $tag" >&2; exit 1 ;;
          esac
          version="${tag#v}"
          if [ -z "$version" ]; then
            echo "Empty version from tag $tag" >&2
            exit 1
          fi
          recorded="$(sed -n 's/^val appVersionName = "\(.*\)"$/\1/p' app/app/build.gradle.kts)"
          if [ -z "$recorded" ] || [ "$(printf '%s\n' "$recorded" | wc -l)" -ne 1 ]; then
            echo "Could not read a single appVersionName from app/app/build.gradle.kts" >&2
            exit 1
          fi
          if [ "$recorded" != "$version" ]; then
            echo "Tag $tag does not match appVersionName $recorded" >&2
            exit 1
          fi
          apk="dsh-android-${tag}.apk"
          cp app/app/build/outputs/apk/release/app-release.apk "$apk"
          cp /tmp/host/pocket-host-linux-x64 /tmp/host-prebuilts/pocket-host-linux-x64
          chmod 755 /tmp/host-prebuilts/*
          notes="dsh-android ${tag} @ ${GITHUB_SHA}. Signed release APK (R8/minify). WS-only (Tailscale/LAN); no libpocket_iroh.so. Signing=${DSH_RELEASE_SIGNING}. Optional desktop sidecars: pocket-host-linux-x64, pocket-host-darwin-arm64 (config.iroh=true)."
          gh release create "$tag" \
            --title "dsh-android ${tag}" \
            --notes "$notes" \
            "$apk" \
            /tmp/host-prebuilts/pocket-host-linux-x64 \
            /tmp/host-prebuilts/pocket-host-darwin-arm64

  emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: R8 release assemble (catch minify breakage before emulator)
        working-directory: app
        run: ./gradlew --no-daemon :app:assembleRelease
      - name: instrumented smoke + release install startup check
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: app
          # android-emulator-runner invokes /bin/sh (dash); avoid bashisms like pipefail.
          script: |
            set -eu
            ./gradlew --no-daemon :app:connectedDebugAndroidTest
            adb install -r app/build/outputs/apk/release/app-release.apk
            adb shell am force-stop dev.dsh.pocket || true
            adb shell am start -W -n dev.dsh.pocket/dev.dsh.pocket.app.MainActivity > /tmp/dsh-release-start.txt
            cat /tmp/dsh-release-start.txt
            grep -E 'Status: ok|Success' /tmp/dsh-release-start.txt
            # Give Compose a moment; crash would leave the process dead.
            sleep 3
            adb shell pidof -s dev.dsh.pocket

name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  plugin:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: plugin } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm run lint
      - run: npm test
  integration:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: plugin } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm install -g pnpm@10 @deepseek-ai/dsh@0.2.1-alpha.2
      - run: dsh --version
      - run: npm run test:integration
  android:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - run: npm install
        working-directory: plugin
      - run: npm install -g pnpm@10 @deepseek-ai/dsh@0.2.1-alpha.2
      - name: protocol client tests against real dsh + plugin
        working-directory: plugin
        run: node test/integration/kotlin-live.mjs
      - name: unit tests + debug APK
        working-directory: app
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-android-debug
          path: |
            app/app/build/outputs/apk/debug/app-debug.apk
            app/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
      - name: publish rolling release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cp app/app/build/outputs/apk/debug/app-debug.apk dsh-android-debug.apk
          git tag -f dsh-android-latest && git push -f origin dsh-android-latest
          gh release view dsh-android-latest >/dev/null 2>&1 || gh release create dsh-android-latest --prerelease --title "dsh-android (latest debug)" --notes "Rolling debug-signed build of main."
          gh release edit dsh-android-latest --notes "Rolling debug-signed build of main @ ${GITHUB_SHA::7}."
          gh release upload dsh-android-latest dsh-android-debug.apk --clobber
  emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: instrumented smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: app
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest

name: ci
on:
  push: { branches: [main] }
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Optional legacy pocket-host (desktop iroh behind config.iroh=true; not on phone path).
  host-binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: pocket-host-linux-x64
          - os: macos-14
            artifact: pocket-host-darwin-arm64
    runs-on: ${{ matrix.os }}
    defaults: { run: { working-directory: plugin } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: plugin/iroh -> target
          key: host-${{ matrix.artifact }}
      - run: npm run build:iroh
      - name: stage binary
        run: |
          src=iroh/target/release/pocket-host
          test -x "$src"
          cp "$src" "${{ matrix.artifact }}"
          chmod 755 "${{ matrix.artifact }}"
          ls -lh "${{ matrix.artifact }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: plugin/${{ matrix.artifact }}

  plugin:
    needs: [host-binaries]
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: plugin } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        with:
          name: pocket-host-linux-x64
          path: /tmp/host
      - name: install pocket-host for tests
        run: |
          mkdir -p iroh/target/release
          cp /tmp/host/pocket-host-linux-x64 iroh/target/release/pocket-host
          chmod 755 iroh/target/release/pocket-host
          iroh/target/release/pocket-host --help >/dev/null
      - run: npm install
      - run: npm run lint
      - run: npm test

  integration:
    needs: [host-binaries]
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: plugin } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        with:
          name: pocket-host-linux-x64
          path: /tmp/host
      - name: install pocket-host for tests
        run: |
          mkdir -p iroh/target/release
          cp /tmp/host/pocket-host-linux-x64 iroh/target/release/pocket-host
          chmod 755 iroh/target/release/pocket-host
      - run: npm install
      - run: npm install -g pnpm@10 @deepseek-ai/dsh@0.2.1-alpha.2
      - run: dsh --version
      - run: npm run test:integration

  android:
    needs: [host-binaries]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: confirm no iroh jniLibs in tree
        run: |
          if [ -d app/app/src/main/jniLibs ]; then
            ! find app/app/src/main/jniLibs -name 'libpocket_iroh.so' | grep .
          fi
      - uses: actions/download-artifact@v4
        with:
          name: pocket-host-linux-x64
          path: /tmp/host
      - name: install pocket-host for kotlin-live
        run: |
          mkdir -p plugin/iroh/target/release
          cp /tmp/host/pocket-host-linux-x64 plugin/iroh/target/release/pocket-host
          chmod 755 plugin/iroh/target/release/pocket-host
      - run: npm install
        working-directory: plugin
      - run: npm install -g pnpm@10 @deepseek-ai/dsh@0.2.1-alpha.2
      - name: protocol client tests against real dsh + plugin
        working-directory: plugin
        run: node test/integration/kotlin-live.mjs
      - name: unit tests + debug APK (no libpocket_iroh.so)
        working-directory: app
        run: ./gradlew --no-daemon :core:protocol:test :app:testDebugUnitTest -Proborazzi.test.record=true :app:assembleDebug :app:assembleDebugAndroidTest
      - name: confirm APK has no iroh native libs; report size
        run: |
          apk=app/app/build/outputs/apk/debug/app-debug.apk
          ls -lh "$apk"
          if unzip -l "$apk" | grep -E 'lib/.*/libpocket_iroh\.so'; then
            echo "APK still contains libpocket_iroh.so" >&2
            exit 1
          fi
          echo "APK_SIZE_BYTES=$(stat -c%s "$apk")"
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-android-debug
          path: |
            app/app/build/outputs/apk/debug/app-debug.apk
            app/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            app/app/build/screenshots/*.png
      - uses: actions/download-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: pocket-host-darwin-arm64
          path: /tmp/host-prebuilts
      - name: publish rolling release (APK + host prebuilts)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cp app/app/build/outputs/apk/debug/app-debug.apk dsh-android-debug.apk
          cp /tmp/host/pocket-host-linux-x64 /tmp/host-prebuilts/pocket-host-linux-x64
          chmod 755 /tmp/host-prebuilts/*
          git tag -f dsh-android-latest && git push -f origin dsh-android-latest
          gh release view dsh-android-latest >/dev/null 2>&1 || gh release create dsh-android-latest --prerelease --title "dsh-android (latest debug)" --notes "Rolling build."
          gh release edit dsh-android-latest --notes "Rolling debug build @ ${GITHUB_SHA::7}. APK is WS-only (Tailscale/LAN); no libpocket_iroh.so. Optional desktop sidecars: pocket-host-linux-x64, pocket-host-darwin-arm64 (config.iroh=true)."
          gh release upload dsh-android-latest \
            dsh-android-debug.apk \
            /tmp/host-prebuilts/pocket-host-linux-x64 \
            /tmp/host-prebuilts/pocket-host-darwin-arm64 \
            --clobber

  emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: instrumented smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: app
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest

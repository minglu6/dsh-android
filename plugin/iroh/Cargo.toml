[workspace]
resolver = "2"
# pocket-ffi (Android JNI) removed from the phone path — APK no longer ships libpocket_iroh.so.
members = ["pocket-iroh", "pocket-host"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
iroh = "1.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
dirs = "6"
clap = { version = "4", features = ["derive"] }
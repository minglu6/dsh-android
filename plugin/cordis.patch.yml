# dsh-android bridge. Config fields (all optional):
#   host: 127.0.0.1    loopback WS for local/dev only (phones use iroh)
#   port: 7690
#   token: <string>    fixed token; otherwise one is generated into $DSH_HOME/pocket/token
#   dataDir: <path>
#   iroh: true         spawn pocket-host sidecar (default true; required for phone pairing)
#   hostBinary: <path> override path to pocket-host
- insert:
    - id: dsh-pocket
      name: dsh-plugin-pocket

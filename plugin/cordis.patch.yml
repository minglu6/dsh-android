# dsh-android bridge. Config fields (all optional):
#   transport: tailscale        phone path is host:port WS only (default)
#   host:                       advertise/bind; omit to auto-detect Tailscale IP then LAN, bind 0.0.0.0
#   port: 7690
#   token: <string>             fixed token; otherwise one is generated into $DSH_HOME/pocket/token
#   dataDir: <path>
#   iroh: true                  opt-in legacy desktop sidecar (not used for phone pairing)
#   hostBinary: <path>          override path to pocket-host (only with iroh: true)
# Phone and desktop share the official in-app browser. Disable the auto owner
# before mounting both browse halves; it would otherwise also mount native on macOS.
- id: directory-picker
  disabled: true

- insert:
    - id: dsh-pocket
      name: dsh-plugin-pocket
    - id: directory-picker-browse
      name: '@deepseek-ai/dsh-host-directory-picker-browse'
    - id: ui-directory-picker-browse
      name: '@deepseek-ai/dsh-client-ui-directory-picker-browse'
